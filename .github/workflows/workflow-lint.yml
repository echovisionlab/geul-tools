name: Workflow lint
on:
  pull_request:
    branches: [main]
    paths: [".github/**", "release-please-config.json"]
permissions:
  contents: read
jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          GOWORK=off go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
          node --test .github/scripts/scope.test.mjs
          jq empty release-please-config.json .release-please-manifest.json
