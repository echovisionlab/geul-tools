name: Release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  scope:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      run_checks: ${{ steps.scope.outputs.run_checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [ "$RELEASE_TAG" = "v$RELEASE_VERSION" ]
          [ "$(git rev-parse HEAD)" = "$RELEASE_SHA" ]
          previous="$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD^ 2>/dev/null || true)"
          node .github/scripts/scope.mjs "$previous" "$RELEASE_SHA"
  publish:
    needs: [release-please, scope]
    if: needs.release-please.outputs.release_created == 'true' && needs.scope.outputs.run_checks == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TOOL: ${{ matrix.tool }}
      IMAGE: registry.dsub.io/echovisionlab/geul-tools-${{ matrix.tool }}
      RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
      RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - name: Validate release commit
        id: context
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$RELEASE_SHA" ]
          echo "created_at=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
      - name: Validate registry credentials
        env:
          HARBOR_REGISTRY_USERNAME: ${{ secrets.HARBOR_REGISTRY_USERNAME }}
          HARBOR_REGISTRY_PASSWORD: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in HARBOR_REGISTRY_USERNAME HARBOR_REGISTRY_PASSWORD; do
            [ -n "${!name:-}" ] || { echo "Missing secret: $name" >&2; exit 1; }
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.dsub.io
          username: ${{ secrets.HARBOR_REGISTRY_USERNAME }}
          password: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}
      - id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: TOOL=${{ matrix.tool }}
          tags: |
            ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE }}:sha-${{ env.RELEASE_SHA }}
          labels: |
            org.opencontainers.image.created=${{ steps.context.outputs.created_at }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.ref.name=${{ env.RELEASE_TAG }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=geul-tools-${{ matrix.tool }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
      - name: Verify immutable image and health
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          for tag in "$RELEASE_TAG" "sha-$RELEASE_SHA"; do
            [ "$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{.Manifest.Digest}}')" = "$DIGEST" ]
          done
          docker pull "$IMAGE@$DIGEST"
          [ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE@$DIGEST")" = "$RELEASE_SHA" ]
          [ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.ref.name" }}' "$IMAGE@$DIGEST")" = "$RELEASE_TAG" ]
          [ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$IMAGE@$DIGEST")" = "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" ]
          [ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$IMAGE@$DIGEST")" = "$RELEASE_VERSION" ]
          container="$(docker run -d --read-only --tmpfs /tmp --env EMBED_PARENT_ORIGINS=https://www.dsub.io "$IMAGE@$DIGEST")"
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          healthy=false
          for attempt in {1..30}; do
            if docker exec "$container" node -e 'fetch("http://127.0.0.1:8080/healthz").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))'; then
              healthy=true; break
            fi
            echo "Waiting for health: attempt $attempt"
            sleep 1
          done
          [ "$healthy" = true ]
          docker exec "$container" node -e 'fetch("http://127.0.0.1:8080/").then(r=>{if(!r.ok || !(r.headers.get("content-security-policy")?.includes("frame-ancestors") && r.headers.get("content-security-policy")?.includes("https://www.dsub.io")))process.exit(1)}).catch(()=>process.exit(1))'
          echo "Published $IMAGE@$DIGEST from $RELEASE_TAG ($RELEASE_SHA)" >> "$GITHUB_STEP_SUMMARY"
